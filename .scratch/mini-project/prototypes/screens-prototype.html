<!doctype html>
<!--
  THROWAWAY PROTOTYPE — wayfinder ticket 07 (Prototype the screens and the demo click path).
  Three variants of MeepleLedger's screen inventory + demo click path, switchable via ?variant=
  and the floating bottom bar. Not sprint code. Nothing here survives.
  Wireframe fidelity on purpose: this is about structure and click path, not styling.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeepleLedger — screen prototype (throwaway)</title>
<style>
  :root{
    --ink:#1b1b1f; --dim:#6b6b76; --line:#c9c9d1; --bg:#f4f4f6; --panel:#fff;
    --accent:#3b4a9c; --warn:#8a5a00; --note:#eef0fa;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .wrap{display:grid;grid-template-columns:1fr 360px;min-height:100vh}
  /* ---- fake blazor app shell (matches the default scaffold: left nav + top bar) ---- */
  .app{display:grid;grid-template-columns:190px 1fr;background:var(--panel);border-right:1px solid var(--line)}
  .nav{background:#2b3a67;color:#dfe3f5;padding:12px 0}
  .nav h1{font-size:15px;margin:0 0 14px;padding:0 14px;color:#fff}
  .nav a{display:block;padding:8px 14px;color:#dfe3f5;text-decoration:none;border-left:3px solid transparent}
  .nav a.on{background:#3d4f86;border-left-color:#fff;color:#fff}
  .main{padding:0}
  .topbar{border-bottom:1px solid var(--line);padding:8px 16px;color:var(--dim);font-size:12px}
  .screen{padding:16px;border-bottom:8px solid var(--bg)}
  .screen h2{font-size:15px;margin:0 0 2px}
  .screen .sub{color:var(--dim);font-size:12px;margin:0 0 10px}
  .tag{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
       padding:2px 6px;border-radius:3px;vertical-align:2px;margin-left:6px}
  .tag.int{background:#e6f0e6;color:#2b5d2b;border:1px solid #b8d8b8}
  .tag.stat{background:#eee;color:#555;border:1px solid #ccc}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
  .row-ctl{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .box{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fafafc;color:var(--dim)}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;padding:6px 10px;font-size:13px}
  .btn.ghost{background:#fff;color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{border:1px solid var(--line);border-radius:4px;padding:10px;background:#fafafc}
  .card b{display:block;font-size:13px}
  .card span{color:var(--dim);font-size:12px}
  .feed li{margin-bottom:8px;list-style:none}
  .feed{padding:0;margin:0}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center;background:#fafafc}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal{border:2px dashed var(--accent);border-radius:6px;padding:12px;background:#fff;margin-top:10px}
  /* ---- the notes rail ---- */
  .rail{padding:18px 16px 90px;background:var(--panel);overflow-y:auto;max-height:100vh}
  .rail h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 0 6px}
  .rail h3:first-child{margin-top:0}
  .rail p{margin:0 0 8px}
  .rail ol,.rail ul{margin:0 0 8px;padding-left:18px}
  .rail li{margin-bottom:4px}
  .name{font-size:17px;font-weight:600;margin:0 0 2px}
  .bet{background:var(--note);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;margin-bottom:8px}
  .cost{color:var(--warn)}
  /* ---- switcher ---- */
  .switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;
    gap:14px;background:#1b1b1f;color:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:99}
  .switch button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
  .switch .lbl{font-size:13px;min-width:230px;text-align:center}
  @media (max-width:1100px){.wrap{grid-template-columns:1fr}.rail{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="nav" id="nav"></div>
    <div class="main">
      <div class="topbar">MeepleLedger — wireframe, variant <span id="vkey"></span></div>
      <div id="screens"></div>
    </div>
  </div>
  <div class="rail" id="rail"></div>
</div>

<div class="switch">
  <button id="prev" title="previous variant">&larr;</button>
  <div class="lbl" id="lbl"></div>
  <button id="next" title="next variant">&rarr;</button>
</div>

<script>
const INT  = '<span class="tag int">@rendermode InteractiveServer</span>';
const STAT = '<span class="tag stat">static</span>';

const games = [
  ['Wingspan','Elizabeth Hargrave','1–5','40–70'],
  ['Brass: Birmingham','Wallace / Brown','2–4','60–120'],
  ['Azul','Michael Kiesling','2–4','30–45'],
  ['Spirit Island','R. Eric Reuss','1–4','90–120'],
  ['7 Wonders Duel','Bauza / Cathala','2','30'],
  ['Cascadia','Randy Flynn','1–4','30–45'],
];
const gameRows = games.map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${g[2]}</td><td>${g[3]} min</td></tr>`).join('');
const gameCards = games.slice(0,6).map(g=>`<div class="card"><b>${g[0]}</b><span>${g[2]} players · ${g[3]} min</span></div>`).join('');
const plays = [
  ['Brass: Birmingham','9 Aug 2026','Brett, Dana, Marcus','Dana won · 142 pts','Home'],
  ['Wingspan','7 Aug 2026','Brett, Priya','Brett won · 81 pts','Home'],
  ['Spirit Island','2 Aug 2026','Brett, Dana','co-op — won','Meeple Mountain Café'],
  ['Azul','28 Jul 2026','Brett, Marcus, Priya, Dana','Marcus won · 96 pts','GenCon 2026'],
];
const playRows = plays.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td></tr>`).join('');
const playFeed = plays.map(p=>`<li class="card"><b>${p[0]}</b><span>${p[1]} · ${p[4]} · ${p[2]}</span><span>${p[3]}</span></li>`).join('');

const VARIANTS = {
  A:{
  name:'The Shelf — collection is the app',
  nav:['Collection','Play Log','Statistics'],
  navOn:0,
  screens:`
    <div class="screen">
      <h2>Collection ${INT}</h2>
      <p class="sub">Landing screen. Every owned game, searchable and filterable. This is what's on screen when the demo starts.</p>
      <div class="row-ctl">
        <div class="box">Search title or designer…</div>
        <div class="box">Plays exactly [ 4 ] players ▾</div>
        <button class="btn ghost">Add a game</button>
      </div>
      <table><tr><th>Title</th><th>Designer</th><th>Players</th><th>Length</th></tr>${gameRows}</table>
      <p class="sub" style="margin-top:8px">18 games owned · filters call <code>GameCollection.Search()</code> / <code>.FilterByPlayerCount()</code></p>
    </div>
    <div class="screen">
      <h2>Game detail ${INT}</h2>
      <p class="sub">Click a row above. One title, its copy details, and its history — the screen where the two aggregates meet on one page.</p>
      <div class="panes">
        <div class="card"><b>Brass: Birmingham</b><span>Wallace / Brown · 2–4 players · 60–120 min</span>
          <span>Acquired 14 Mar 2025 · Condition: <b>Good</b></span></div>
        <div class="card"><b>Played 6 times</b><span>Most recent 9 Aug 2026</span><span>Your win rate: 33%</span>
          <button class="btn" style="margin-top:6px">Log a play of this</button></div>
      </div>
    </div>
    <div class="screen">
      <h2>Log a play ${INT}</h2>
      <p class="sub">A form, pre-filled with the game you came from. Reached from game detail or from the Play Log screen.</p>
      <div class="modal">
        <div class="row-ctl"><div class="box">Game: Brass: Birmingham ▾</div><div class="box">Played on: 11 Aug 2026</div>
        <div class="box">Location (optional)</div><div class="box">Duration (optional)</div></div>
        <table><tr><th>Player</th><th>Score (optional)</th><th>Won?</th></tr>
          <tr><td>Brett</td><td>121</td><td>☐</td></tr><tr><td>Dana</td><td>142</td><td>☑</td></tr>
          <tr><td colspan="3"><button class="btn ghost">+ add player</button></td></tr></table>
        <button class="btn" style="margin-top:8px">Save play</button>
      </div>
    </div>
    <div class="screen">
      <h2>Play Log ${INT}</h2>
      <p class="sub">Every play, newest first. Secondary screen — you navigate here, you don't land here.</p>
      <table><tr><th>Game</th><th>Date</th><th>Players</th><th>Result</th><th>Where</th></tr>${playRows}</table>
    </div>
    <div class="screen">
      <h2>Statistics ${STAT}</h2>
      <p class="sub">Read-only. The LINQ showcase — no buttons, so no render mode needed.</p>
      <div class="stat"><div><b>18</b><span>games owned</span></div><div><b>47</b><span>plays logged</span></div><div><b>Azul</b><span>most played</span></div></div>
      <table><tr><th>Game</th><th>Plays</th><th>Your wins</th></tr>
        <tr><td>Azul</td><td>11</td><td>5</td></tr><tr><td>Brass: Birmingham</td><td>6</td><td>2</td></tr>
        <tr><td>Wingspan</td><td>6</td><td>4</td></tr></table>
    </div>`,
  rail:`
    <p class="name">A — The Shelf</p>
    <p class="sub">5 screens · collection-first · demo explores a populated app</p>
    <div class="bet"><b>The bet:</b> the collection is the thing you own, so it's the thing you land on. Plays hang off games.</div>
    <h3>Screen inventory</h3>
    <ol>
      <li><b>Collection</b> — interactive (search box, filter, row click)</li>
      <li><b>Game detail</b> — interactive (button to log)</li>
      <li><b>Log a play</b> — interactive (form)</li>
      <li><b>Play Log</b> — interactive (delete/filter) — <i>cuttable to static</i></li>
      <li><b>Statistics</b> — static, read-only</li>
    </ol>
    <h3>Demo click path</h3>
    <ol>
      <li>Open on a shelf of 18 real games — instantly legible, no explaining.</li>
      <li>Type "wallace" in search → list narrows live. <i>(LINQ, visible)</i></li>
      <li>Filter to "plays 4" → narrows again.</li>
      <li>Click Brass → detail with 6 plays and a win rate.</li>
      <li>Log a play live: add players, tick a winner, save.</li>
      <li>Play Log → the new play is on top.</li>
      <li>Statistics → the counter moved because of what you just did.</li>
    </ol>
    <h3>Hour-one minimum</h3>
    <p>Collection + Log a play. That alone tells a whole story.</p>
    <h3>Cut list</h3>
    <p>Statistics first, then Game detail (fold its button onto the collection row).</p>
    <h3 class="cost">Costs</h3>
    <p>Most screens of the three. Game detail is a fifth screen that mostly re-displays data you've already seen.</p>`
  },

  B:{
  name:'The Log — activity is the app',
  nav:['Recent Plays','Collection','Statistics'],
  navOn:0,
  screens:`
    <div class="screen">
      <h2>Recent Plays (home) ${INT}</h2>
      <p class="sub">Landing screen is your history, not your shelf. Big primary action sits at the top.</p>
      <button class="btn">＋ Log a play</button>
      <p class="sub" style="margin-top:10px">Newest first — <code>PlayLog.RecentFirst()</code></p>
      <ul class="feed">${playFeed}</ul>
    </div>
    <div class="screen">
      <h2>Log a play ${INT}</h2>
      <p class="sub">The centre of gravity. Game picker searches the <b>catalog</b>, not the collection — so convention games you don't own are loggable.</p>
      <div class="modal">
        <div class="row-ctl"><div class="box">Search catalog: "spirit"… ▾</div><div class="box">Played on: 11 Aug 2026</div><div class="box">Location: GenCon 2026</div></div>
        <table><tr><th>Player</th><th>Score</th><th>Won?</th></tr>
          <tr><td>Brett <i>(always you)</i></td><td>—</td><td>☑</td></tr><tr><td>Dana</td><td>—</td><td>☑</td></tr>
          <tr><td colspan="3"><button class="btn ghost">+ add player</button></td></tr></table>
        <p class="sub">Co-op: no scores, two winners. The permissive model on display.</p>
        <button class="btn">Save play</button>
      </div>
    </div>
    <div class="screen">
      <h2>Collection ${INT}</h2>
      <p class="sub">Demoted to a secondary tab. Cards, not a table — it's a shelf you browse, not data you scan.</p>
      <div class="row-ctl"><div class="box">Search…</div><button class="btn ghost">Add a game</button></div>
      <div class="cards">${gameCards}</div>
    </div>
    <div class="screen">
      <h2>Statistics ${STAT}</h2>
      <p class="sub">Richer here, because the log is the app's subject. Every number is a LINQ query over plays.</p>
      <div class="stat"><div><b>47</b><span>plays</span></div><div><b>62%</b><span>win rate</span></div><div><b>9</b><span>at conventions</span></div></div>
      <table><tr><th>Game</th><th>Plays</th><th>Owned?</th></tr>
        <tr><td>Azul</td><td>11</td><td>yes</td></tr><tr><td>Root</td><td>4</td><td><b>no — café copy</b></td></tr>
        <tr><td>Brass: Birmingham</td><td>6</td><td>yes</td></tr></table>
      <p class="sub">That "no" row is the model's headline decision made visible.</p>
    </div>`,
  rail:`
    <p class="name">B — The Log</p>
    <p class="sub">4 screens · activity-first · demo tells a story about playing games</p>
    <div class="bet"><b>The bet:</b> the interesting decision in the model is that plays are independent of ownership. Put that on the landing screen instead of burying it.</div>
    <h3>Screen inventory</h3>
    <ol>
      <li><b>Recent Plays (home)</b> — interactive</li>
      <li><b>Log a play</b> — interactive (form)</li>
      <li><b>Collection</b> — interactive (search, add)</li>
      <li><b>Statistics</b> — static</li>
    </ol>
    <p>No game-detail screen at all. One fewer screen than A.</p>
    <h3>Demo click path</h3>
    <ol>
      <li>Open on a lived-in feed of plays — dates, people, places.</li>
      <li>"Log a play" → search the <b>catalog</b> for a game you don't own.</li>
      <li>Log a co-op with no scores and two winners — the permissive model.</li>
      <li>Feed shows it on top.</li>
      <li>Collection tab: "notice that game isn't here — I played it at a café."</li>
      <li>Statistics: the <b>Owned? no</b> row proves it.</li>
    </ol>
    <h3>Hour-one minimum</h3>
    <p>Recent Plays + Log a play. The collection can arrive in hour three.</p>
    <h3>Cut list</h3>
    <p>Statistics, then the collection <i>search</i> (keep the plain list).</p>
    <h3 class="cost">Costs</h3>
    <p>The collection — where <code>Dictionary</code>, the duplicate-title guard, and <code>OwnedGame</code>/<code>Condition</code> live — becomes the side dish. Rubric evidence is real but less on stage.</p>`
  },

  C:{
  name:'The Console — one screen, no navigation',
  nav:['Ledger'],
  navOn:0,
  screens:`
    <div class="screen">
      <h2>Ledger — the whole app ${INT}</h2>
      <p class="sub">One route. Shelf on the left, history on the right, logging in a panel underneath. Nothing is ever more than one click away and nothing navigates.</p>
      <div class="stat"><div><b>18</b><span>owned</span></div><div><b>47</b><span>plays</span></div><div><b>Azul</b><span>most played</span></div></div>
      <div class="panes">
        <div>
          <h2 style="font-size:13px">My shelf</h2>
          <div class="row-ctl"><div class="box">Search…</div><div class="box">Players ▾</div></div>
          <table><tr><th>Title</th><th>Players</th></tr>
            ${games.map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[2]}</td></tr>`).join('')}</table>
        </div>
        <div>
          <h2 style="font-size:13px">Recent plays</h2>
          <ul class="feed">${playFeed}</ul>
        </div>
      </div>
      <div class="modal">
        <b>Log a play</b> <span class="sub">— expands in place, never leaves the screen</span>
        <div class="row-ctl" style="margin-top:8px"><div class="box">Game ▾</div><div class="box">Date</div><div class="box">Players</div><button class="btn">Save</button></div>
        <p class="sub">Save → both panes above refresh at once. The state change is visible in two places simultaneously.</p>
      </div>
    </div>
    <div class="screen">
      <h2>(no second screen)</h2>
      <p class="sub">Statistics live in the strip at the top. Game detail is a row expansion, not a page. The nav menu has one entry — arguably none.</p>
    </div>`,
  rail:`
    <p class="name">C — The Console</p>
    <p class="sub">1 screen · everything visible at once · demo is a single unbroken view</p>
    <div class="bet"><b>The bet:</b> in a 5-hour sprint, routing and navigation are ceremony that earn nothing on the rubric. Spend the whole budget on one dense screen instead.</div>
    <h3>Screen inventory</h3>
    <ol><li><b>Ledger</b> — interactive. That's it.</li></ol>
    <p>Statistics = a strip. Game detail = a row expansion. Log a play = an inline panel.</p>
    <h3>Demo click path</h3>
    <ol>
      <li>Open the app — the whole thing is on screen, no tour needed.</li>
      <li>Search the shelf → left pane narrows.</li>
      <li>Expand a row for copy details and its play history.</li>
      <li>Log a play inline → <b>both panes and the stat strip move at once.</b></li>
      <li>Never navigate, never wait, nothing to get lost in.</li>
    </ol>
    <h3>Hour-one minimum</h3>
    <p>The left pane rendering seeded games. Everything else is additive on one file.</p>
    <h3>Cut list</h3>
    <p>Right pane → stat strip → row expansion. Cuts don't break navigation because there isn't any.</p>
    <h3 class="cost">Costs</h3>
    <p>One big <code>.razor</code> file is a weaker showcase of <i>components</i> than five small ones. Demos densely — impressive or cluttered depending on the projector. Also the least like a "real web app", if the grader wants to see routing.</p>`
  }
};

const keys = Object.keys(VARIANTS);
function render(){
  const k = keys.includes(new URLSearchParams(location.search).get('variant'))
          ? new URLSearchParams(location.search).get('variant') : 'A';
  const v = VARIANTS[k];
  document.getElementById('vkey').textContent = k;
  document.getElementById('nav').innerHTML =
    '<h1>MeepleLedger</h1>' + v.nav.map((n,i)=>`<a href="#" class="${i===v.navOn?'on':''}">${n}</a>`).join('');
  document.getElementById('screens').innerHTML = v.screens;
  document.getElementById('rail').innerHTML = v.rail;
  document.getElementById('lbl').textContent = `${k} — ${v.name}`;
  return k;
}
function go(step){
  const k = render();
  const next = keys[(keys.indexOf(k)+step+keys.length)%keys.length];
  const u = new URL(location); u.searchParams.set('variant', next); history.replaceState({},'',u);
  render(); window.scrollTo(0,0);
}
document.getElementById('prev').onclick = ()=>go(-1);
document.getElementById('next').onclick = ()=>go(1);
addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowLeft') go(-1); if(e.key==='ArrowRight') go(1);
});
render();
</script>
</body>
</html>
