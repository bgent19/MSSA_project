# MeepleLedger locally in containers (A-23): the web app, the embed worker, and Postgres (pgvector)
# and Redis (with search) for company.
#
#   docker compose up --build        then open http://localhost:8080
#   docker compose down              stop and remove the containers (add -v to drop the Postgres data)
#
# With no .env file the app runs on the in-memory Provider (ADR-0001) and the worker exits straight
# away, saying which setting it is missing: it needs Service Bus, Azure OpenAI and Cosmos DB, and none
# of those run locally. Settings go in a .env file next to this one (gitignored), with a double
# underscore for the colon, e.g.
#
#   AzureOpenAI__Endpoint=https://...
#   AzureOpenAI__Key=...
#   AzureOpenAI__EmbeddingDeployment=game-embeddings
#   ServiceBus__ConnectionString=Endpoint=sb://...
#   Cosmos__Endpoint=https://...
#   Cosmos__Key=...
#   Bgg__Token=...                  (S-07: "Add from BoardGameGeek"; without it the page says lookup isn't set up)
#   SEARCH_INDEX_PROVIDER=Postgres
#   RECOMMENDATION_CACHE_ENABLED=true
#
# Nothing here is baked into an image: the images only ever see these as environment variables.

services:
  app:
    build:
      context: .
      dockerfile: MeepleLedger/Dockerfile
    image: meepleledger:dev
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # InMemory unless .env says otherwise. Postgres or Redis also needs the AzureOpenAI__* settings,
      # because an Ask is embedded by Azure OpenAI whichever Provider answers it.
      SearchIndex__Provider: ${SEARCH_INDEX_PROVIDER:-InMemory}
      # Where the Collection and the Play Log live (S-04). Cosmos needs the Cosmos__* settings.
      MeepleStore__Provider: ${MEEPLE_STORE_PROVIDER:-InMemory}
      RecommendationCache__Enabled: ${RECOMMENDATION_CACHE_ENABLED:-false}
      # The local containers below, by their service names. Only read when a setting above uses them.
      Postgres__ConnectionString: Host=postgres;Port=5432;Database=meepleledger;Username=meeple;Password=${POSTGRES_PASSWORD:-meeple-local}
      Redis__ConnectionString: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: MeepleLedger.Worker/Dockerfile
    image: meepleledger-worker:dev
    env_file:
      - path: .env
        required: false
    environment:
      Cosmos__Database: meepleledger
      Cosmos__Container: games
    # Missing settings are not fixed by a restart, so don't loop on them
    restart: "no"
    # docker stop sends SIGTERM, then kills after this long. The worker uses the time to let the
    # messages it is handling settle instead of leaving them locked on the queue.
    stop_grace_period: 30s

  postgres:
    # Postgres with the pgvector extension already installed (Azure allow-lists it instead, A-11)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: meepleledger
      POSTGRES_USER: meeple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeple-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: the extension, the games table and its
      # indexes. upload-postgres can then fill it, pointed at this container instead of Azure.
      - ./infra/postgres/games-schema.sql:/docker-entrypoint-initdb.d/games-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeple -d meepleledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis 8 ships the query engine (FT.SEARCH) built in, like RediSearch on Azure Managed Redis.
    # Plain TCP and a single shard here; Azure is TLS only and clustered (watch for CROSSSLOT there).
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
