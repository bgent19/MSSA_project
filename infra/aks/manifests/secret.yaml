# A-28: the keys. stringData takes plain text; Kubernetes stores it base64-encoded under .data.
#
# BASE64 IS NOT ENCRYPTION. Anyone who can read Secrets in this namespace can read the values:
#   kubectl get secret meepleledger-secrets -n meepleledger -o jsonpath="{.data.cosmos-key}"
# and decode them. That is the setup for A-29 (Key Vault).
#
# The values in capitals between double underscores are placeholders, and this file must stay that
# way: real keys never go in git. deploy-aks.ps1 replaces them from the user secrets in memory and pipes the result to kubectl
# apply, so the filled-in file is never written to disk.
#
# The keys are kebab-case (cosmos-key). The Deployments map each one to the environment variable
# the app reads (Cosmos__Key) with secretKeyRef, and each container gets only the keys it needs.
apiVersion: v1
kind: Secret
metadata:
  name: meepleledger-secrets
  namespace: meepleledger
type: Opaque
stringData:
  cosmos-key: "__COSMOS_KEY__"
  azure-openai-key: "__AZURE_OPENAI_KEY__"
  servicebus-connection-string: "__SERVICEBUS_CONNECTION_STRING__"
